version: "3.9"

services:

  web:
    build: .
    container_name: django_todo

    command: >
      sh -c "
      python manage.py migrate &&
      python manage.py runserver 0.0.0.0:8000
      "

    volumes:
      - .:/app

    ports:
      - "80:8000"

    depends_on:
      - db

    environment:
      DB_NAME: todo_db
      DB_USER: root
      DB_PASSWORD: root
      DB_HOST: db
      DB_PORT: 3306

  db:
    image: mysql:8.0

    container_name: mysql_db

    restart: always

    environment:
      MYSQL_DATABASE: todo_db
      MYSQL_ROOT_PASSWORD: root

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: